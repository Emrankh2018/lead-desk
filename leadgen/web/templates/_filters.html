{# expects `flt`, `stages`, `icps`, `active_filters` (set by the page before including) #}
<form method="get" class="panel tight" role="search">
  <div class="row">
    <label class="grow">Search <input type="search" name="q" value="{{ flt.q }}" placeholder="Name, website or Instagram"></label>
    <label>Stage
      <select name="stage_id"><option value="">All stages</option>
        {% for s in stages %}<option value="{{ s.id }}" {{ 'selected' if flt.stage_id == s.id }}>{{ s.name }}</option>{% endfor %}
      </select></label>
    <label>Sort
      <select name="sort">
        {% for k, v in [('updated','Recently updated'),('created','Recently added'),('name','Name'),('follow_up','Follow-up date'),('score','Score')] %}
        <option value="{{ k }}" {{ 'selected' if flt.sort == k }}>{{ v }}</option>{% endfor %}
      </select></label>
    <button type="submit">Apply</button>
    {% if active_filters %}<a class="btn quiet" href="{{ request.url.path }}">Clear filters</a>{% endif %}
  </div>
  <details {{ 'open' if flt.icp_id or flt.city or flt.industry or flt.dnc != 'exclude' or flt.follow_up_due }} style="margin-top: 10px">
    <summary>More filters</summary>
    <div class="row">
      <label>Profile
        <select name="icp_id"><option value="">All profiles</option>
          {% for i in icps %}<option value="{{ i.id }}" {{ 'selected' if flt.icp_id == i.id }}>{{ i.name }}</option>{% endfor %}
        </select></label>
      <label>City <input type="text" name="city" value="{{ flt.city }}" class="w-sm"></label>
      <label>Industry <input type="text" name="industry" value="{{ flt.industry }}" class="w-sm"></label>
      <label>Do-not-contact
        <select name="dnc">
          <option value="exclude" {{ 'selected' if flt.dnc == 'exclude' }}>Hide</option>
          <option value="include" {{ 'selected' if flt.dnc == 'include' }}>Show</option>
          <option value="only" {{ 'selected' if flt.dnc == 'only' }}>Only these</option>
        </select></label>
      <label class="inline" style="min-height: 38px"><input type="checkbox" name="due" value="1" {{ 'checked' if flt.follow_up_due }}> Follow-up due</label>
    </div>
  </details>
</form>
