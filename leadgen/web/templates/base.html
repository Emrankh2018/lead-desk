<!doctype html>
<html lang="{{ ui_lang }}" dir="{{ ui_dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Leads{% endblock %} · Lead Desk</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
{% if user %}
<header class="top">
  <div class="brand">Lead Desk</div>
  {% set path = request.url.path %}
  <nav aria-label="Main">
    <a href="/leads" class="{{ 'active' if path.startswith('/leads') }}">Leads</a>
    <a href="/pipeline" class="{{ 'active' if path.startswith('/pipeline') }}">Pipeline</a>
    <a href="/discover" class="{{ 'active' if path.startswith('/discover') }}">Discover</a>
    <a href="/research" class="{{ 'active' if path.startswith('/research') }}">Research</a>
    <a href="/outreach" class="{{ 'active' if path.startswith('/outreach') }}">Outreach</a>
    <a href="/import" class="{{ 'active' if path.startswith('/import') }}">Import</a>
    <a href="/duplicates" class="{{ 'active' if path.startswith('/duplicates') }}">Duplicates</a>
    <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">Settings</a>
    <a href="/audit" class="{{ 'active' if path.startswith('/audit') }}">Audit log</a>
  </nav>
  <form method="post" action="/logout"><button class="link" type="submit">Sign out</button></form>
</header>
{% endif %}
<main>
  {% for kind, msg in flashes %}<div class="flash {{ kind }}" role="status">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script>
  // Selects marked data-autosubmit submit their form on change (pipeline stage moves).
  document.querySelectorAll('select[data-autosubmit]').forEach(s => s.addEventListener('change', () => s.form.submit()));
  // Copy buttons: data-copy points at the id of a textarea/input whose value is copied to the clipboard.
  document.querySelectorAll('button[data-copy]').forEach(b => b.addEventListener('click', async () => {
    const el = document.getElementById(b.dataset.copy);
    try { await navigator.clipboard.writeText(el.value); b.textContent = 'Copied'; } catch { el.select(); }
  }));
</script>
</body>
</html>
