[project]
name = "leadgen"
version = "0.0.1"
description = "Local-first, evidence-backed AI lead generation assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
